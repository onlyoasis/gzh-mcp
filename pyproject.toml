[project]
name = "gzh-mcp"
version = "0.1.0"
description = "微信公众号发布 MCP server"
readme = "README.md"
license = "MIT"
authors = [
    { name = "onlyoasis" },
]
repository = "https://github.com/onlyoasis/gzh-mcp"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2,<3",
]

[project.scripts]
gzh-mcp = "gzh_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

